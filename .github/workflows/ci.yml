# The essential checks a pull request must pass: lint, typecheck, format and
# unit tests for the frontend; fmt, clippy and the full test suite for the
# Rust backend on Windows, and clippy plus the unit tests on macOS and Linux
# (the cfg-gated CUPS and process code). linux.yml runs the full Linux suite
# (a display, a CUPS queue, the converters) after a merge, not here.
# Dependency audits are not here either: a new advisory must not fail a pull
# request that changes no dependency, so audit.yml runs them on a schedule,
# on lockfile changes and before every release. Nothing here builds an
# installer or reads a secret; release.yml builds, measures and signs the
# shipped artifacts (and checks THIRD-PARTY-NOTICES.md first).
# `make check-full` runs everything, audits included, locally.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Every job only reads the repository; none publishes anything.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck + format + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

  # The Rust code is heavily cfg-gated (WinSpool and the Explorer handler on
  # Windows, CUPS on macOS and Linux, /proc and WebKitGTK on Linux), so it is
  # checked on every shipped platform. Linux runs on ubuntu-22.04, the image
  # release.yml builds the Linux packages on (glibc 2.35), so the baseline
  # that ships is the one that is linted; x64 only: ARM64 is in linux.yml.
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    env:
      # A test run never moves a MaeclyPrint-era data directory (ADR-0009).
      PLURYPRINT_SKIP_MIGRATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is on every hosted runner, so the toolchain needs no action
      # (as in release.yml).
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      # What tauri links against on Linux (WebKitGTK, GTK, librsvg, and
      # D-Bus through tao: libdbus-sys panics at build time without it), plus
      # the two tools the bundler calls. The hosted image has none of it.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev librsvg2-dev patchelf file

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            shell-ext-win/target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'shell-ext-win/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      # Formatting does not depend on the platform: once is enough.
      - name: cargo fmt
        if: runner.os == 'Windows'
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path shell-ext-win/Cargo.toml --all -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Windows: a full run, never filtered: tests/ipc_surface.rs regenerates
      # src/ipc/bindings.ts and fails when the committed copy is stale. The
      # integration tests do not depend on the platform, so macOS and Linux
      # run only the unit tests, which hold their cfg-gated code (CUPS,
      # Finder, /proc). They need no display: linux.yml runs the rest.
      - name: cargo test
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo test (unit)
        if: runner.os != 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # The Explorer context-menu DLL is its own crate (own target dir, own
      # `panic = "unwind"` release profile), and its COM layer only builds
      # on Windows.
      - name: cargo clippy (shell extension)
        if: runner.os == 'Windows'
        run: cargo clippy --manifest-path shell-ext-win/Cargo.toml --all-targets -- -D warnings

      - name: cargo test (shell extension)
        if: runner.os == 'Windows'
        run: cargo test --manifest-path shell-ext-win/Cargo.toml
