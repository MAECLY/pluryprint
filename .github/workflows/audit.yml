# Dependency audits (NFR-065), kept out of the pull-request gate: an advisory
# published against an unchanged tree must not fail a pull request that
# changes no dependency. They run every Monday (so a new advisory is noticed
# without anyone touching the tree), on every push to main that moves a
# lockfile, and by hand. release.yml's guard runs the same audits before a
# release is built. Locally: `make audit`.
name: Audit

on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'src-tauri/Cargo.lock'
      - 'shell-ext-win/Cargo.lock'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'src-tauri/.cargo/audit.toml'
  workflow_dispatch:

# Every job only reads the repository; none publishes anything.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit@0.22.2

      # Known vulnerabilities (RustSec) in both locked trees. Fails on any
      # advisory not ignored, with its reason, in src-tauri/.cargo/audit.toml.
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

      - name: cargo audit (shell extension)
        working-directory: shell-ext-win
        run: cargo audit

  npm:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # Known vulnerabilities in what ships in the bundle. Dev-only
      # advisories that cannot be fixed yet are listed, with reasons, in
      # docs/07-build-and-release/ci-cd.md (package.json auditConfig).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
